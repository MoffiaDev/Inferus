  changes:
    - type: Add
      message: >-
        Speech bubbles now type out letter by letter with voice blips. Pick your
        character's blip in the character editor.
    - type: Add
      message: >-
        Voice blips rise in pitch when asking questions and fall when
        exclaiming, and text briefly pauses on punctuation.
    - type: Remove
      message: Choosing "Voice" is no longer an option (it didnt even work anyway)
  id: 2
