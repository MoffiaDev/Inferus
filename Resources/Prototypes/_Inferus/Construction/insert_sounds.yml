# Place sounds that play when an item is put into a construction step, a machine frame, or used up by a crafting recipe.
# Rules are checked from highest priority to lowest, and the first match wins. The fallback rule is used when nothing matches.
# Sounds are from Resources/Audio/Construction (see attributions.yml there).

- type: constructionInsertSound
  id: Electronics
  priority: 40
  sound:
    collection: PlaceElectronics
  components:
  - MachineBoard
  - ComputerBoard
  - BorgBrain
  componentPatterns:
  - Electronics
  - Circuitboard
  tagPatterns:
  - Electronics
  - Circuitboard
  tags:
  - SmallAIChip
  - ProximitySensor
  - Igniter
  - SignalTrigger
  - VoiceTrigger

- type: constructionInsertSound
  id: Wires
  priority: 30
  sound:
    collection: PlaceWires
  stacks:
  - Cable
  - CableMV
  - CableHV
  - CableDet

- type: constructionInsertSound
  id: Glass
  priority: 20
