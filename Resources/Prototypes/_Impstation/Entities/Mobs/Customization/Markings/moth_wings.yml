# Inferus: mousesweater and CrocodileCarousel's layered wings.
# https://github.com/impstation/imp-station-14/pull/3396

- type: marking
  id: LunaWings
  bodyPart: Tail
  groupWhitelist: [Moth]
  layering:
    luna_neck: TailBehindBackpack
    luna_primary_behind: TailBehind
    luna_primary_front: TailBehindBackpack
    luna_secondary_behind: TailBehind
    luna_secondary_front: TailBehindBackpack
  colorLinks:
    luna_primary_behind: luna_primary_front
    luna_secondary_behind: luna_secondary_front
  canBeDisplaced: false
  sprites:
  - sprite: _Impstation/Mobs/Customization/Moth/taillayers.rsi
    state: luna_neck
  - sprite: _Impstation/Mobs/Customization/Moth/taillayers.rsi
    state: luna_primary_behind
  - sprite: _Impstation/Mobs/Customization/Moth/taillayers.rsi
    state: luna_primary_front
  - sprite: _Impstation/Mobs/Customization/Moth/taillayers.rsi
    state: luna_secondary_behind
  - sprite: _Impstation/Mobs/Customization/Moth/taillayers.rsi
    state: luna_secondary_front

