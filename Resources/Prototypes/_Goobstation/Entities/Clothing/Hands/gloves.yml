- type: entity
  parent: [BaseSyndicateContraband, ClothingHandsGlovesCombat]
  id: ClothingHandsGlovesGuerrilla
  name: guerrilla gloves
  description: Top-of-the-line quality combative gloves, good for grabs as well as absorbing electrical shocks. Seems to be powered by telecrystals, somehow... # Inferus
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Hands/Gloves/guerrilla.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Hands/Gloves/guerrilla.rsi
    equipDelay: 2 #sadly this has to exist for telegraphing reasons
    unequipDelay: 2
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#940000"
      right:
      - state: inhand-right
        color: "#940000"
  - type: GrabModifier
    startingGrabStage: Hard
    grabEscapeModifier: -0.1
    grabEscapeMultiplier: 0.8
    grabMoveSpeedMultiplier: 2 # 0.8 speed modifier on hard grab
