- type: entity
  name: mustard mothroach
  parent: MobMothroach
  id: MobMothroachMustard
  description: A delightful result of the world's chefs crossing meat with sauce.
  components:
  - type: Sprite
    sprite: _Goobstation/Mobs/Animals/mustard_mothroach.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mothroach

