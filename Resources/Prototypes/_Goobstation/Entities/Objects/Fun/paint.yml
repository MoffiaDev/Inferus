- type: entity
  abstract: true
  parent: BaseItem
  id: BasePaintCanvas
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Fun/canvas.rsi
    layers:
    - state: canvas_24x24
      map: [ "backing" ]
    - map: [ "paint" ]
    - map: [ "frame" ]
      visible: false
  - type: Item
    size: Normal
  - type: PaintSurface
    background: "#ffffff"
  - type: PaintCanvasVisuals
  - type: ActivatableUI
    key: enum.PaintUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaintUiKey.Key:
        type: PaintBoundUserInterface
  - type: FaxableObject
  - type: StaticPrice
    price: 20

- type: entity
  parent: BasePaintCanvas
  id: PaintCanvas
  name: canvas
  description: A blank square canvas. Use a crayon, paint or a palette on it to start painting.
  components:
  - type: PaintSurface
    size: 64, 64
  - type: PaintCanvasVisuals
    sizeKey: 24x24
    backingState: canvas_24x24
    paintScale: 0.375, 0.375
    easelOffset: 0, 0.09375
  - type: Construction
    graph: PaintCanvasGraph
    node: canvas

- type: entity
  parent: BasePaintCanvas
  id: PaintCanvasLandscape
  name: landscape canvas
  description: A wide blank canvas, good for scenery.
  components:
  - type: Sprite
    layers:
    - state: canvas_23x19
      map: [ "backing" ]
    - map: [ "paint" ]
    - map: [ "frame" ]
      visible: false
  - type: PaintSurface
    size: 69, 57
  - type: PaintCanvasVisuals
    sizeKey: 23x19
    backingState: canvas_23x19
    paintScale: 0.33333334, 0.33333334
    paintOffset: 0.015625, 0.015625
    easelOffset: 0, 0.0234375
  - type: Construction
    graph: PaintCanvasGraph
    node: landscape

- type: entity
  parent: BasePaintCanvas
  id: PaintCanvasSmall
  name: small canvas
  description: A tiny blank canvas, perfect for doodles and portraits.
  components:
  - type: Sprite
    layers:
    - state: canvas_11x11
      map: [ "backing" ]
    - map: [ "paint" ]
    - map: [ "frame" ]
      visible: false
  - type: Item
    size: Small
  - type: PaintSurface
    size: 33, 33
  - type: PaintCanvasVisuals
    sizeKey: 11x11
    backingState: canvas_11x11
    paintScale: 0.33333334, 0.33333334
    paintOffset: 0.015625, -0.015625
    easelOffset: 0, -0.046875
  - type: StaticPrice
    price: 10
  - type: Construction
    graph: PaintCanvasGraph
    node: small
