# Inferus: upstream replaced the gateway UI with StationTeleporter auto-linking, so both Lavaland gateways now pair through a shared autoLinkKey instead of tag restrictions.
- type: entity
  parent: Gateway
  id: GatewayLavaland
  name: Lavaland gateway
  description: To hell you go.
  components:
  - type: StationTeleporter
    portalLayerMap: "portal"
    autoLinkKey: Lavaland
  - type: Tag
    tags:
    - Structure
    - LavalandGateway

- type: entity
  parent: Gateway
  id: GatewayLavalandStation
  name: Lavaland gateway
  description: To hell you go.
  suffix: Station
  components:
  - type: StationTeleporter
    portalLayerMap: "portal"
    autoLinkKey: Lavaland
  - type: Tag
    tags:
    - Structure
    - LavalandStationGateway
