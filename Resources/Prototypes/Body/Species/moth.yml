- type: markingsGroup
  parent: Undergarments
  id: Moth
  onlyGroupWhitelisted: true
  limits:
    # Inferus - moths can pick regular hair and facial hair styles
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
      onlyGroupWhitelisted: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
      onlyGroupWhitelisted: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ MothWingsDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ MothAntennasDefault ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMoth
  categories: [ HideSpawnMenu ]
  name: moth appearance
  components:
  # Moth displacement maps ported from funky-station
  - type: Inventory
    speciesId: moth
    femaleDisplacements:
      gloves:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: gloves
      shoes:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: shoes
      ears:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: ears
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: jumpsuit_female
      outerClothing: # Inferus - stops moth legs poking out of suits and coats
        sizeMaps:
          32:
            sprite: _Inferus/Mobs/Species/Moth/displacement.rsi
            state: outerclothing
    maleDisplacements:
      gloves:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: gloves
      shoes:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: shoes
      ears:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: ears
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
            state: jumpsuit_male
      outerClothing: # Inferus - stops moth legs poking out of suits and coats
        sizeMaps:
          32:
            sprite: _Inferus/Mobs/Species/Moth/displacement.rsi
            state: outerclothing
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
          state: inhand_left
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _Funkystation/Mobs/Species/Moth/displacement.rsi
          state: inhand_right
  - type: InitialBody
    organs:
      Torso: OrganMothTorso
      Head: OrganMothHead
      ArmLeft: OrganMothArmLeft
      ArmRight: OrganMothArmRight
      HandRight: OrganMothHandRight
      HandLeft: OrganMothHandLeft
      LegLeft: OrganMothLegLeft
      LegRight: OrganMothLegRight
      FootLeft: OrganMothFootLeft
      FootRight: OrganMothFootRight
      Brain: OrganMothBrain
      Eyes: OrganMothEyes
      Tongue: OrganMothTongue
      Appendix: OrganMothAppendix
      Ears: OrganMothEars
      Lungs: OrganMothLungs
      Heart: OrganMothHeart
      Stomach: OrganMothStomach
      Liver: OrganMothLiver
      Kidneys: OrganMothKidneys
  - type: HumanoidProfile
    species: Moth

- type: entity
  parent:
  - AppearanceMoth
  - BaseSpeciesMobOrganic
  id: MobMoth
  name: Urist McFluff
  components:
  - type: FootprintOwner # Inferus
    leftBarePrint: footprint-left-bare-spider
    rightBarePrint: footprint-right-bare-spider
  - type: Damageable
    damageModifierSet: Moth
  - type: ZombieAccentOverride
    accent: zombieMoth
  - type: Speech
    speechVerb: Moth
    allowedEmotes: ['Chitter', 'Squeak', 'Flap']
  - type: TypingIndicator
    proto: moth
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_moth
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 600
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MothAccent
  - type: Vocal
    emoteSounds: UnisexMoth
  - type: BodyEmotes
    soundsId: MothBodyEmotes
  - type: MovementSpeedModifier
    baseWeightlessAcceleration: 1.5 # Move around more easily in space.
    baseWeightlessFriction: 1
    baseWeightlessModifier: 1
  - type: Flammable
    damage:
      types:
        Heat: 2.5 # moths burn more easily
  - type: TemperatureDamage # Moths hate the heat and thrive in the cold.
    heatDamageThreshold: 314.15
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05 # per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 3 # per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      289: 0.9
      275: 0.8
      250: 0.7

- type: entity
