      state: vulp
    - sprite: Mobs/Customization/Vulpkanin/tail_markings.rsi
      state: vulp-tip

- type: marking
  id: VulpTailVulpFade
  bodyPart: Tail
  groupWhitelist: [ Vulpkanin ]
