- type: entity
  parent: BaseItem
  id: RadioHandheld
  name: handheld radio
  description: A handy handheld radio.
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    toggleOnSound: /Audio/_Funkystation/Radio/radio_on.ogg # funky addition - toggle sfx
    toggleOffSound: /Audio/_Funkystation/Radio/radio_off.ogg # funky addition - toggle sfx
    listenRange: 1 #funky
    maxRange: 4 #funkayyyy - volume ui
    speakerRequired: true # funky - toggleable mic
  - type: ActivatableUI #funkayyyy - volume ui
    verbOnly: true
    requiresComplex: true
    verbText: radio-vol-menu-verb
    key: enum.RadioVolumeUiKey.Key
  - type: UserInterface #funkayyyy - volume ui
    interfaces:
      enum.RadioVolumeUiKey.Key:
        type: RadioVolumeBoundUserInterface
  - type: UseDelay # funky
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - map: [enum.RadioDeviceVisualLayers.Broadcasting]
      state: walkietalkie-on
      shader: unshaded
      visible: false
    - map: [enum.RadioDeviceVisualLayers.Speaker]
      state: walkietalkie-active
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Speaker:
        enum.RadioDeviceVisualLayers.Speaker:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio

- type: entity
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  name: security radio
  description: A handy security radio.
  components:
  - type: RadioMicrophone
    broadcastChannel: Security
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Sprite
    sprite: Objects/Devices/securityhandy.rsi
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
