- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesBlindfold
  name: blindfold
  description: The bind leading the blind.
  components:
  # Inferus
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/generic_small_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/generic_small_drop.ogg
      params:
        volume: -4
  # End Inferus
  - type: Sprite
    sprite: Clothing/Eyes/Misc/blindfold.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Misc/blindfold.rsi
    equipDelay: 3
    unequipDelay: 3
  - type: Blindfold
  - type: Construction
    graph: Blindfold
    node: blindfold
  - type: FlashImmunity

- type: entity
  parent: ClothingHeadEyeBaseFlippable
  id: ClothingEyesEyepatch
  name: eyepatch
  description: Yarr.
  components:
  # Inferus
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/generic_small_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/generic_small_drop.ogg
      params:
        volume: -4
  # End Inferus
  - type: Sprite
    sprite: Clothing/Eyes/Misc/eyepatch.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Misc/eyepatch.rsi
  - type: EyeProtection
    protectionTime: 5

- type: entity
  parent: [ClothingEyesEyepatch, ClothingHeadEyeBaseFlipped]
  id: ClothingEyesEyepatchFlipped
  suffix: flipped
