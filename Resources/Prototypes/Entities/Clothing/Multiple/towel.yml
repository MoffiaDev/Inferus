- type: entity
  abstract: true
  parent: [UnsensoredClothingUniformBase, ClothingHeadBase, ClothingBeltBase]
  id: BaseTowel
  name: base towel
  description: If you want to survive out here, you gotta know where your towel is.
  components:
  - type: Sprite
    sprite: Clothing/Multiple/towel.rsi
  - type: Clothing
    sprite: Clothing/Multiple/towel.rsi
    slots:
    - BELT
    - INNERCLOTHING
    - HEAD
    femaleMask: UniformTop
    equipSound:
    unequipSound:
  - type: Spillable
    solution: absorbed
    spillWhenThrown: false
  - type: Absorbent
    pickupAmount: 15
  - type: SolutionManager
    solutions:
    - SolutionMopSmall
  - type: UseDelay
    delay: 1
  - type: Fiber
    fiberColor: fibers-white
  - type: DnaSubstanceTrace
  - type: Item
    size: Small

- type: entity
  id: TowelColorWhite
  name: white towel
  parent: BaseTowel
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#EAE8E8"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#EAE8E8"
      right:
      - state: inhand-right
        color: "#EAE8E8"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#EAE8E8"
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#EAE8E8"
      belt:
      - state: equipped-BELT
        color: "#EAE8E8"
  - type: Fiber
    fiberColor: fibers-white

- type: entity
  id: TowelColorNT
  name: Aetheris brand towel # Inferus - Death to NT!
  description: Now, you may be asking, "Why would anyone want a towel with the Aetheris logo on it?". To that, I answer; fuck you, why not? # Inferus - Death to NT!
  parent: BaseTowel
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#004787"
    - state: iconstripe
      color: "#EAE8E8"
    - state: NTmono
      color: "#EAE8E8"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#004787"
      right:
      - state: inhand-right
        color: "#004787"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#004787"
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#004787"
      belt:
      - state: equipped-BELT
        color: "#004787"
  - type: Fiber
    fiberColor: fibers-regal-blue

- type: entity
  id: TowelColorCentcom
  name: centcom towel
  parent: BaseTowel
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#db461d" # Inferus - redcomm
    - state: iconstripe
      color: "#f5896c" # Inferus - redcomm
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#db461d" # Inferus - redcomm
      right:
      - state: inhand-right
        color: "#db461d" # Inferus - redcomm
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#db461d" # Inferus - redcomm
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#db461d" # Inferus - redcomm
      belt:
      - state: equipped-BELT
        color: "#db461d" # Inferus - redcomm
  - type: Fiber
    fiberColor: fibers-red # Inferus - redcomm

- type: entity
  id: TowelColorSyndicate
  name: syndicate towel
  parent: [ BaseTowel, BaseSyndicateContraband ]
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#535353"
    - state: iconstripe
      color: "#940000"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#535353"
      right:
      - state: inhand-right
        color: "#535353"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#535353"
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#535353"
      belt:
      - state: equipped-BELT
        color: "#535353"
  - type: Fiber
    fiberColor: fibers-black
