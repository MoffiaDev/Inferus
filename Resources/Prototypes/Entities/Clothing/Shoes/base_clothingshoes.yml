- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolNormal, Clothing]
  id: ClothingShoesBase
  components:
  # Inferus
  - type: ItemEquipSounds
    equipSound:
      path: /Audio/_Inferus/Items/Handling/Clothing/sneakers_equip.ogg
      params:
        volume: -4
    unequipSound:
      path: /Audio/_Inferus/Items/Handling/Clothing/sneakers_equip.ogg
      params:
        volume: -6
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Inferus/Items/Handling/Clothing/sneakers_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Inferus/Items/Handling/Clothing/sneakers_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/boots_drop.ogg
      params:
        volume: -5
  # Begin Inferus
  - type: FootstepTimbre
    pitch: 1.04
    volume: -1.5
  # End Inferus
  - type: Clothing
    equipSound:
      collection: GenericEquip
      params:
        volume: -5
    slots:
    - FEET
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: ProtectedFromStepTriggers
  - type: SolutionManager
    solutions:
    - SolutionStain
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      shoes:
      - sprite: /Textures/_Funkystation/Effects/blood.rsi
        state: shoeblood
    iconVisuals:
    - sprite: /Textures/_Funkystation/Effects/blood.rsi
      state: shoebloodicon

- type: entity
  abstract: true
  parent: [ClothingShoesBase, BaseSlicingRefinable]
  id: ClothingShoesBaseButcherable
  components:
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50

# stuff common to all military boots
- type: entity
  abstract: true
  parent: [ClothingShoesBase, ClothingSlotBase]
  id: ClothingShoesMilitaryBase
  components:
  # Begin Inferus
  - type: FootstepTimbre
    pitch: 0.9
    volume: 1.5
  # End Inferus
  - type: Matchbox
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        priority: 4
        ejectOnBreak: true
        whitelist:
          tags:
          - Knife
          - Sidearm

- type: entity
  abstract: true
  id: ClothingShoesBootsSecFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - CombatKnife

- type: entity
  abstract: true
  parent: [ ClothingShoesBaseButcherable, TemperatureProtectionMinimal ]
  id: ClothingShoesBaseWinterBoots
  description: Fluffy boots to help survive even the coldest of winters.
  # Begin Inferus
  components:
  - type: FootstepTimbre
    pitch: 0.94
    volume: -0.5
  # End Inferus
