    state: r_leg_hydraulic
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: r_leg_hydraulic
  - type: CyberneticLeg
    sprintModifier: 0.756
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

- type: entity
  id: ProstheticLegHydraulicRight
  parent: DetachedBody
  name: right hydraulic cyber leg
  description: A machine leg with its foot, suitable for moving heavy loads at near-normal speed. It sprints a little slower than a normal leg. Attach it to the torso of a patient who has lost that limb.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
