# Ported from Starlight (Resources/Prototypes/_Starlight/Body/Parts/cyberlimbs.yml: spacer and gorilla) // Inferus

- type: entity
  id: OrganProstheticArmSpacerLeft
  parent: [ OrganBaseArmLeft, OrganProstheticBase ]
  name: left spacer arm
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_spacer_arm
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_spacer_arm
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

- type: entity
  id: OrganProstheticHandSpacerLeft
  parent: [ OrganBaseHandLeft, OrganProstheticBase ]
  name: left spacer hand
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_spacer_hand
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_spacer_hand
  - type: Woundable
    integrity: 90
    integrityCap: 90
    thresholds:
      Minor: 75
      Moderate: 60
      Severe: 45
      Critical: 27
      Mangled: 0
  - type: ContainerContainer
  - type: LimbItemStorage
    items:
    - ProtokineticAcceleratorCyber
    - WeaponGrapplingGunCyber
    - WeaponCrusherDaggerCyber
  - type: LimbItemDeployer
    action: ActionToggleCyberHandLeft
    sound:
      path: /Audio/_Shitmed/Medical/Cyber/deploy.ogg
    handWhitelist:
      tags:
      - CyberHandItem

- type: entity
  id: ProstheticArmSpacerLeft
  parent: DetachedBody
  name: left spacer arm
  description: A machine arm with its hand, a mining arm. Its hand keeps a protokinetic accelerator, a grappling gun and a crusher dagger. Attach it to the torso of a patient who has lost that limb.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticArmSpacerLeft
    - OrganProstheticHandSpacerLeft

