# Ported from Starlight (Resources/Prototypes/_Starlight/Body/Parts/cyberlimbs.yml: scribe and investigator) // Inferus
# The tool lists are Starlight's minus the items that are not ported (see cyberlimb_tools_office.yml).

- type: entity
  id: OrganProstheticArmScribeLeft
  parent: [ OrganBaseArmLeft, OrganProstheticBase ]
  name: left scribe arm
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_scribe_arm
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_scribe_arm
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

- type: entity
  id: OrganProstheticHandScribeLeft
  parent: [ OrganBaseHandLeft, OrganProstheticBase ]
  name: left scribe hand
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_scribe_hand
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_scribe_hand
  - type: Woundable
    integrity: 90
    integrityCap: 90
    thresholds:
      Minor: 75
      Moderate: 60
      Severe: 45
      Critical: 27
      Mangled: 0
  - type: ContainerContainer
  - type: LimbItemStorage
    items:
    - PenCyber
    - FilingCabinetCyber
  - type: LimbItemDeployer
    action: ActionToggleCyberHandLeft
    sound:
      path: /Audio/_Shitmed/Medical/Cyber/deploy.ogg
    handWhitelist:
      tags:
      - CyberHandItem

- type: entity
  id: ProstheticArmScribeLeft
  parent: DetachedBody
  name: left scribe arm
  description: A machine arm with its hand, an office arm. Its hand keeps a pen and a file keeper for documents. Attach it to the torso of a patient who has lost that limb.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticArmScribeLeft
    - OrganProstheticHandScribeLeft

