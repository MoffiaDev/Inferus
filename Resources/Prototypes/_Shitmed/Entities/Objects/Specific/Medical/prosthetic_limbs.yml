# SPDX-License-Identifier: AGPL-3.0-or-later
# Inferus - cybernetic limbs ported from Starlight (Resources/Prototypes/_Starlight/Body/Parts/cyberlimbs.yml): arms with hands, and legs with feet.
# The organs are sturdier than flesh (1.5 times the integrity) and an EMP switches them off for a while. The item is a severed limb that the reattach
# surgery takes, with the torso as the part to attach to.
# Legs: the plain cyber leg is 5% faster at a sprint, the budget leg has no bonus, the speed leg is 1.5 times as fast. Shoes hinder the bonus (CyberneticLeg).
- type: entity
  id: OrganProstheticBase
  abstract: true
  parent: OrganBase
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Human
  - type: CyberneticOrgan
    markLost: false
    empDamage: 0

- type: entity
  id: OrganProstheticLegBase
  abstract: true
  parent: OrganProstheticBase
  components:
  - type: CyberneticOrgan
    markLost: false
    empDamage: 0
    empSpeedModifier: 0.6

- type: entity
  id: OrganProstheticArmLeft
  parent: [ OrganBaseArmLeft, OrganProstheticBase ]
  name: prosthetic left arm
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_arm
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_arm
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

