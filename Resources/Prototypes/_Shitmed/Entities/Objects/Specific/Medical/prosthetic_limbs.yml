# Inferus - prosthetic limbs. The organs are sturdier than flesh (1.5 times the integrity) and look like the human limbs, since there is no art
# for them. The item is a severed limb that the reattach surgery takes: the arm and hand, or the leg and foot, with the torso as the part to attach to.
- type: entity
  id: OrganProstheticBase
  abstract: true
  parent: OrganBase
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human

- type: entity
  id: OrganProstheticArmLeft
  parent: [ OrganBaseArmLeft, OrganProstheticBase ]
  name: prosthetic left arm
  components:
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

- type: entity
  id: OrganProstheticArmRight
  parent: [ OrganBaseArmRight, OrganProstheticBase ]
