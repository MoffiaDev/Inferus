- type: entity
  id: ProstheticArmLeft
  parent: DetachedBody
  name: prosthetic left arm
  description: A machine arm with its hand. Attach it to the torso of a patient who has lost that limb, with the same surgery that reattaches a severed one.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticArmLeft
    - OrganProstheticHandLeft

- type: entity
  id: ProstheticLegLeft
  parent: DetachedBody
  name: prosthetic left leg
  description: A machine leg with its foot that lets you sprint a little faster than the organic one. Shoes take most of that away.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticLegLeft
    - OrganProstheticFootLeft

- type: entity
  id: ProstheticLegBudgetLeft
  parent: DetachedBody
  name: budget prosthetic left leg
  description: A shoddy machine leg with its foot and no extra functionality.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticLegBudgetLeft
    - OrganProstheticFootLeft

- type: entity
  id: ProstheticLegSpeedLeft
  parent: DetachedBody
  name: prosthetic left speed leg
  description: A machine leg with its foot that moves you much faster, as long as you do not wear shoes.
