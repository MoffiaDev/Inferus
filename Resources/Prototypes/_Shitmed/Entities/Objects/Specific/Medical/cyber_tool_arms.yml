# Ported from Starlight (Resources/Prototypes/_Starlight/Body/Parts/cyberlimbs.yml: reaper, mechwright and engineer) // Inferus
# Cybernetic arms whose hand keeps tools. The hand toggles them out with its action (LimbItemDeployer). The organs are 1.5 times as tough as flesh.

- type: entity
  id: OrganProstheticArmReaperLeft
  parent: [ OrganBaseArmLeft, OrganProstheticBase ]
  name: left reaper arm
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_silver_arm
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_silver_arm
  - type: Woundable
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 105
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0

- type: entity
  id: OrganProstheticHandReaperLeft
  parent: [ OrganBaseHandLeft, OrganProstheticBase ]
  name: left reaper hand
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
    state: l_silver_hand
  - type: VisualOrgan
    data:
      sprite: _Shitmed/Mobs/Species/Cyberlimbs/parts.rsi
      state: l_silver_hand
  - type: Woundable
    integrity: 90
    integrityCap: 90
    thresholds:
      Minor: 75
      Moderate: 60
      Severe: 45
      Critical: 27
      Mangled: 0
  - type: ContainerContainer
  - type: LimbItemStorage
    items:
    - ScalpelCyber
    - HemostatCyber
    - RetractorCyber
    - BoneSetterCyber
    - BoneGelCyber
    - CauteryCyber
    - DrillCyber
    - SawCyber
  - type: LimbItemDeployer
    action: ActionToggleCyberHandLeft
    sound:
      path: /Audio/_Shitmed/Medical/Cyber/deploy.ogg
    handWhitelist:
      tags:
      - CyberHandItem

- type: entity
  id: ProstheticArmReaperLeft
  parent: DetachedBody
  name: left reaper arm
  description: A machine arm with its hand, a surgical arm. Its hand keeps a scalpel, hemostat, retractor, bone setter, bone gel, cautery, drill and saw, all of them much faster than the ordinary ones. Attach it to the torso of a patient who has lost that limb.
  categories: [ ]
  components:
  - type: DetachedLimb
  - type: ProstheticLimb
    attachCategory: Torso
    organs:
    - OrganProstheticArmReaperLeft
    - OrganProstheticHandReaperLeft

