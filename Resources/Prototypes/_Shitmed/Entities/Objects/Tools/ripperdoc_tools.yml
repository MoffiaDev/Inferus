# Ported from Starlight (Resources/Prototypes/_Starlight/Entities/Objects/Specific/Medical/surgery.yml, the *Ripper tools) // Inferus
# The ripperdoc tools: slower than the reaper ones, a little slower than a normal one in fact (Starlight had 1.2 as a duration multiplier, so 0.83 here),
# and they weigh on the arm (sprint 10% slower while they are out). The weapons of the tools do no damage.

- type: entity
  parent: Scalpel
  id: ScalpelRipper
  name: scalpel
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/surgery.rsi
    layers:
    - state: scalpelripper
  - type: Scalpel
    speed: 0.83
  - type: MeleeWeapon
    damage:
      types:
        Slash: 0
  - type: HeldSpeedModifier
    walkModifier: 1
    sprintModifier: 0.9
  - type: Tag
    tags:
    - SurgeryTool
    - CyberHandItem

