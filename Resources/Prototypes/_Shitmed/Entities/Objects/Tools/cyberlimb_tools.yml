# Ported from Starlight (Resources/Prototypes/_Starlight/Entities/Objects/Tools/cyberlimb.yml and .../Medical/surgery.yml) // Inferus
# The tools of the cybernetic hands. They have the tag the hands accept and cannot be dropped while they are out (the deployer system makes them unremovable).
# The speed of a surgical tool here is how many times faster than a normal one it is. Starlight had it the other way round (0.2 = five times faster).

# Reaper - surgery

- type: entity
  parent: Scalpel
  id: ScalpelCyber
  name: scalpel
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Specific/Medical/surgery.rsi
    layers:
    - state: scalpel
  - type: Scalpel
    speed: 5
  - type: Tag
    tags:
    - SurgeryTool
    - CyberHandItem

