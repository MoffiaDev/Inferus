# Engineer
- type: entity
  parent: PowerDrill
  id: PowerDrillCyber
  name: cyber drill
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Tools/cyberling.rsi
    layers:
    - state: drill_screw
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: [ Screwing ]
      sprite:
        sprite: _Shitmed/Objects/Tools/cyberling.rsi
        state: drill_screw
      useSound:
        path: /Audio/Items/drill_use.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
    - behavior: [ Anchoring ]
      sprite:
        sprite: _Shitmed/Objects/Tools/cyberling.rsi
        state: drill_bolt
      useSound:
        path: /Audio/Items/drill_use.ogg
      changeSound:
        path: /Audio/Items/change_drill.ogg
  - type: Tag
    tags:
    - CyberHandItem

- type: entity
  parent: JawsOfLife
  id: JawsOfLifeCyber
  name: cybernetic jaws of life
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Tools/cyberling.rsi
    layers:
    - state: jaws_pry
  - type: MultipleTool
    statusShowBehavior: true
    entries:
    - behavior: [ Prying ]
      sprite:
        sprite: _Shitmed/Objects/Tools/cyberling.rsi
        state: jaws_pry
      useSound: /Audio/Items/jaws_pry.ogg
      changeSound: /Audio/Items/change_jaws.ogg
    - behavior: [ Cutting ]
      sprite:
        sprite: _Shitmed/Objects/Tools/cyberling.rsi
        state: jaws_cutter
      useSound: /Audio/Items/jaws_cut.ogg
      changeSound: /Audio/Items/change_jaws.ogg
  - type: Tag
    tags:
    - CyberHandItem

- type: entity
  parent: WelderExperimental
