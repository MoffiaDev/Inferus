# SPDX-License-Identifier: AGPL-3.0-or-later
# Ported from Starlight (Resources/Prototypes/_Starlight/Entities/Objects/Weapons/Melee/cyberlimb.yml: zeus and herakles) // Inferus
# The stun fist extends the stun baton of Inferus. The zeus fist is the Starlight definition with the EMP pulse done by EmpOnMeleeHit.
# The Herakles fist is the Starlight one without the door-prying sounds, and the holographic restrainer is not ported yet.

- type: entity
  parent: Stunbaton
  id: MeleeWeaponCyberStunFist
  name: stun fist
  description: Arm-mounted electric shock delivery device. Handle with care.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Tools/cyberling.rsi
    layers:
    - state: stunfist_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: MeleeWeapon
    attackRate: 1
    angle: 0
    damage:
      types:
        Blunt: 8
    bluntStaminaDamageFactor: 2.0
    animation: WeaponArcFist
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: stunfist_on }
          False: { state: stunfist_off }
  - type: Tag
    tags:
    - CyberHandItem

- type: entity
  id: MeleeWeaponCyberEmpFist
  parent: BaseItem
  name: zeus fist
  description: Arm-mounted EMP capacitor, ready to disable an electrical device.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Tools/cyberling.rsi
    layers:
    - state: zeusfist_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 0
    animation: WeaponArcFist
    wideAnimation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: ToggleCellDraw
  - type: PowerCellDraw
    useCharge: 715
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
        volume: -10
    activatedDamage:
      types:
        Blunt: 5
        Shock: 15
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        whitelist:
          components:
          - PowerCell
        blacklist:
          tags:
          - MechReactor
          requireAll: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: EmpOnMeleeHit
    range: 0.5
    energyConsumption: 50000
    disableDuration: 60
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: zeusfist_on }
          False: { state: zeusfist_off }
  - type: Tag
    tags:
    - CyberHandItem

- type: entity
  name: Herakles fist
  parent: BaseItem
  id: MeleeWeaponCyberHerakles
  description: An ostensibly nonlethal arm replacement. Strong enough to toss people around and pry open doors.
  components:
  - type: Sprite
    sprite: _Shitmed/Objects/Tools/cyberling.rsi
    state: herakles
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcFist
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
    soundHit:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: StaminaDamageOnHit
    damage: 20
  - type: MeleeThrowOnHit
    speed: 15
    distance: 5
  - type: DamageOnAttackedProtection
    damageProtection:
      flatReductions:
        Heat: 100
        Cold: 100
        Radiation: 100
    slots: NONE
  - type: Prying
    speedModifier: 1.5
    pryPowered: true
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Tag
    tags:
    - CyberHandItem
