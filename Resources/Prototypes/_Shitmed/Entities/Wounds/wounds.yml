# Ported from Goob-Station (Resources/Prototypes/_Shitmed/Entities/Surgery/wounds.yml) // Inferus
# A wound prototype's ID is "Wound" followed by the damage type it represents, WoundSystem looks wounds up that way.
# The prefix is needed because plain damage type names collide with existing entities, e.g. the Blunt joint.
# Inferus - the TraumaInflicter of a wound decides which traumas a hit can cause, see trauma_types.yml for the causes. Pain and bleed components
# and scar wounds were left out, they arrive with those systems.
# Damage types without a wound here (Asphyxiation, Bloodloss, Structural) are kept as body damage instead.

- type: entity
  id: WoundBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Wound
    damageType: Blunt

- type: entity
  id: WoundBlunt
  parent: WoundBase
  components:
  - type: Wound
    damageType: Blunt
    woundType: External
    woundVisibility: Always
    mangleSeverity: Severe
  - type: TraumaInflicter
    severityThreshold: 12
    allowArmourDeduction: [ Dismemberment, OrganDamage, BoneDamage, VeinsDamage, NerveDamage ]
    traumasChances:
      Dismemberment: -0.4
      OrganDamage: 0.17
      BoneDamage: 0.8
      VeinsDamage: 0
      NerveDamage: 0
    mangledMultipliers:
      BoneDamage: 1

