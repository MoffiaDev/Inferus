# The entities trauma_types.yml points at. One of these is spawned for every trauma and lives in the trauma container of a wound.

- type: entity
  id: BoneDamage
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: BoneDamage

- type: entity
  id: OrganDamage
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: OrganDamage

- type: entity
  id: VeinsDamage
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: VeinsDamage

- type: entity
  id: NerveDamage
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: NerveDamage

- type: entity
  id: Dismemberment
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: Dismemberment

- type: entity
  id: TraumaShrapnel
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: Shrapnel
  - type: TraumaBloodloss
    amount: 0.8

- type: entity
  id: TraumaBraindeath
  categories: [ HideSpawnMenu ]
  components:
  - type: Trauma
    traumaType: Braindeath
  - type: Braindeath