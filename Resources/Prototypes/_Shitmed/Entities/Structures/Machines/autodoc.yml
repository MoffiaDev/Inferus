# Adapted from Goob-Station. Left out: Sanitized, SurgerySpeedModifier, GuideHelp and the Syndie variant, which need systems Inferus does not have yet.

- type: entity
  parent: [ ConstructibleMachine, BaseMachinePowered, BaseAutomatedMachine ]
  id: Autodoc
  name: Autodoc Mk.XIV
  description: A programmable robotic surgeon capable of automatically operating on patients.
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/autodoc.rsi
    layers:
    - state: idle
  - type: Hands
  - type: HandsFill
    hands:
      multitool: OmnimedToolAutodoc
      surgery_specific: null
  - type: WiresPanel
  - type: Wires
    layoutId: Autodoc
    boardName: wires-board-name-autodoc
  - type: Machine
    board: AutodocCircuitboard
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
    - storagebase
  - type: EmptyOnMachineDeconstruct
    containers:
    - surgery_specific
    - storagebase
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
        showEnts: False
        occludes: True
        ents: []
      machine_parts: !type:Container
        showEnts: False
        occludes: True
        ents: []
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: AutomationSlots
    slots:
    - !type:AutomatedStorage
      input: AutomationSlotStorage
      output: AutomationSlotStorage
    - !type:AutomatedHand
      input: AutomationSlotAutodocHand
      output: AutomationSlotAutodocHand
      handName: surgery_specific
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - OperatingTableReceiver
  - type: UserInterface
    interfaces:
      enum.AutodocUiKey.Key:
        type: AutodocBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.AutodocUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: Autodoc
  - type: DoAfter
    raiseEndedEvent: true
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Storage
    clickInsert: false
    openOnActivate: false
    grid:
    - 0,0,3,3

# The arm the autodoc holds. Inferus has no omnitool, so this carries the six surgery tools the surgery system knows.
- type: entity
  parent: BaseItem
  id: OmnimedToolAutodoc
  name: autodoc surgical arm
  suffix: Unremoveable, Autodoc
  components:
  - type: Unremoveable
  - type: Scalpel
    speed: 2
  - type: Retractor
    speed: 2
  - type: Hemostat
    speed: 2
  - type: Cautery
    speed: 2
  - type: Drill
    speed: 2
  - type: BoneSaw
    speed: 2