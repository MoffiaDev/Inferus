# Inferus - taking internal organs out and putting them back in. All of it needs the incision fully open.
# Removing: hemostat. Implanting: no tool, the organ is held in the active hand.

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepExtractAppendix
  name: remove the appendix
  components:
  - type: SurgeryStep
    pain: 20
    tool:
    - type: Hemostat
  - type: SurgeryExtractOrganStep
    category: Appendix

- type: entity
  parent: SurgeryBase
  id: SurgeryExtractAppendix
  name: remove the appendix
  components:
  - type: Surgery
    priority: 30
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepExtractAppendix
  - type: SurgeryOrganCondition
    category: Appendix

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepImplantAppendix
  name: implant the appendix
  components:
  - type: SurgeryStep
    pain: 15
  - type: SurgeryImplantOrganStep
    category: Appendix

- type: entity
  parent: SurgeryBase
  id: SurgeryImplantAppendix
  name: implant the appendix
  components:
  - type: Surgery
    priority: 31
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepImplantAppendix
  - type: SurgeryOrganCondition
    category: Appendix
    present: false
    host: Torso

